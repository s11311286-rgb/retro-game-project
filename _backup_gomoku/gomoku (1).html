<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>復古五子棋 Gomoku</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:repeating-linear-gradient(0deg,#17221d 0 3px,#1b2822 3px 6px);color:#e8dfc2;font-family:"Courier New",monospace}.game{width:700px;max-width:96vw;text-align:center}h1{margin:0 0 12px;font-size:28px;letter-spacing:4px}.topbar{display:flex;justify-content:space-between;border:3px solid #c5b98e;padding:10px 18px;margin-bottom:14px;background:#202c25;box-shadow:5px 5px 0 #0b100d;font-size:17px}.label{color:#9eac8b}canvas{display:block;width:620px;height:620px;max-width:100%;margin:auto;background:#b59a67;border:8px solid #51452f;box-shadow:8px 8px 0 #0b100d,inset 0 0 0 3px #d0bd82;cursor:crosshair}.hint{margin-top:16px;color:#aeb49b;font-size:13px;line-height:1.7}.gameover{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(5,8,7,.78)}.gameover.show{display:flex}.panel{width:360px;max-width:90vw;padding:30px;background:#202c25;border:4px solid #c5b98e;box-shadow:8px 8px 0 #050706}.panel h2{margin:0 0 18px;font-size:32px;letter-spacing:4px}.panel p{margin:8px 0}.restart{margin-top:20px;padding:10px 18px;border:2px solid #c5b98e;background:#28372e;color:#e8dfc2;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="game">
<h1>★ GOMOKU ★</h1>
<div class="topbar"><div><span class="label">SCORE</span> <span id="score">0</span></div><div><span class="label">HIGH</span> <span id="high">0</span></div><div><span class="label">TURN</span> <span id="turn">PLAYER</span></div></div>
<canvas id="board" width="620" height="620"></canvas>
<div class="hint">滑鼠點擊落子　｜　方向鍵 / WASD 移動　｜　ENTER 落子<br>你執黑棋 ●　電腦執白棋 ○　｜　先連成五子者勝</div>
</div>
<div class="gameover" id="over"><div class="panel"><h2 id="result">GAME OVER</h2><p id="msg"></p><p>SCORE: <span id="final">0</span></p><button class="restart" onclick="restart()">按 SPACE 重新開始</button></div></div>
<script>
const c=document.getElementById("board"),ctx=c.getContext("2d"),N=15,CELL=40,O=20;
let b,cur,player,ended,score,high=+localStorage.gomokuHigh||0;
document.getElementById("high").textContent=high;
function restart(){b=Array.from({length:N},()=>Array(N).fill(0));cur={x:7,y:7};player=true;ended=false;score=0;document.getElementById("score").textContent=0;document.getElementById("turn").textContent="PLAYER";document.getElementById("over").classList.remove("show");draw()}
function draw(){ctx.fillStyle="#b59a67";ctx.fillRect(0,0,620,620);ctx.strokeStyle="#463c29";ctx.lineWidth=2;for(let i=0;i<N;i++){let p=O+i*CELL;ctx.beginPath();ctx.moveTo(O,p);ctx.lineTo(O+14*CELL,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,O);ctx.lineTo(p,O+14*CELL);ctx.stroke()}[[3,3],[7,3],[11,3],[3,7],[7,7],[11,7],[3,11],[7,11],[11,11]].forEach(([x,y])=>{ctx.fillStyle="#403624";ctx.beginPath();ctx.arc(O+x*CELL,O+y*CELL,5,0,7);ctx.fill()});for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x])stone(x,y,b[y][x]);if(player&&!ended){ctx.strokeStyle="#e9d99d";ctx.lineWidth=3;ctx.strokeRect(O+cur.x*CELL-18,O+cur.y*CELL-18,36,36)}}
function stone(x,y,p){let X=O+x*CELL,Y=O+y*CELL;ctx.beginPath();ctx.arc(X,Y,15,0,7);ctx.fillStyle=p==1?"#111613":"#ded8c1";ctx.fill();ctx.strokeStyle=p==1?"#303b34":"#77725f";ctx.lineWidth=2;ctx.stroke()}
function inside(x,y){return x>=0&&x<N&&y>=0&&y<N}
function count(x,y,dx,dy,p){let n=0;for(x+=dx,y+=dy;inside(x,y)&&b[y][x]==p;x+=dx,y+=dy)n++;return n}
function win(x,y,p){return [[1,0],[0,1],[1,1],[1,-1]].some(([dx,dy])=>1+count(x,y,dx,dy,p)+count(x,y,-dx,-dy,p)>=5)}
function full(){return b.every(r=>r.every(v=>v))}
function scorePos(x,y,p){let s=0;for(let [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1,o=0;for(let q of [1,-1]){let X=x+dx*q,Y=y+dy*q;while(inside(X,Y)&&b[Y][X]==p){n++;X+=dx*q;Y+=dy*q}if(inside(X,Y)&&b[Y][X]==0)o++}s+=n>=5?100000:n==4?(o==2?10000:3000):n==3?(o==2?1000:200):n==2?(o==2?100:20):5}return s}
function ai(){if(ended)return;let best=-1,m=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!b[y][x]){let v=scorePos(x,y,2)*1.15+scorePos(x,y,1)+(10-Math.abs(x-7)-Math.abs(y-7));if(v>best){best=v;m=[{x,y}]}else if(v==best)m.push({x,y})}let z=m[Math.random()*m.length|0];b[z.y][z.x]=2;if(win(z.x,z.y,2))return end(false);player=true;document.getElementById("turn").textContent="PLAYER";draw()}
function place(x,y){if(!player||ended||b[y][x])return;b[y][x]=1;score+=10;document.getElementById("score").textContent=score;if(score>high){high=score;localStorage.gomokuHigh=high;document.getElementById("high").textContent=high}if(win(x,y,1))return end(true);if(full())return end(null);player=false;document.getElementById("turn").textContent="COMPUTER";draw();setTimeout(ai,350)}
function end(w){ended=true;document.getElementById("final").textContent=score;document.getElementById("result").textContent=w===true?"YOU WIN!":w===false?"GAME OVER":"DRAW";document.getElementById("msg").textContent=w===true?"恭喜！你成功連成五子！":w===false?"電腦連成五子了！":"棋盤已滿，平手！";document.getElementById("over").classList.add("show");draw()}
function move(dx,dy){if(!player||ended)return;cur.x=(cur.x+dx+N)%N;cur.y=(cur.y+dy+N)%N;draw()}
c.onclick=e=>{let r=c.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)*c.width/r.width-O)/CELL),y=Math.round(((e.clientY-r.top)*c.height/r.height-O)/CELL);if(inside(x,y)){cur={x,y};place(x,y)}};
document.onkeydown=e=>{let k=e.key.toLowerCase();if(ended&&e.code=="Space"){e.preventDefault();restart();return}if(k=="arrowup"||k=="w")move(0,-1);if(k=="arrowdown"||k=="s")move(0,1);if(k=="arrowleft"||k=="a")move(-1,0);if(k=="arrowright"||k=="d")move(1,0);if(e.key=="Enter"&&player&&!ended)place(cur.x,cur.y)};
restart();
</script>
</body>
</html>
