<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DINO RUN - 恐龍跳躍</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- =========================
         標題與分數
    ========================== -->
    <header class="header">
      <div class="logo">
        <div class="logo-dino">🦖</div>
        <div>
          <h1>DINO RUN</h1>
          <p>躲避障礙，跑得更遠！</p>
        </div>
      </div>

      <div class="difficulty-group" id="difficultyGroup">
        <button type="button" class="diff-btn" data-diff="EASY">🟢 簡單</button>
        <button type="button" class="diff-btn active" data-diff="NORMAL">🟡 普通</button>
        <button type="button" class="diff-btn" data-diff="HARD">🔴 困難</button>
      </div>

      <div class="score-board">
        分數 <span id="score" class="score">00000</span><br>
        最高 <span id="highScore" class="score">00000</span>
      </div>
    </header>

    <!-- =========================
         遊戲場景
    ========================== -->
    <main id="game">
      <!-- 太陽 -->
      <div class="sun"></div>

      <!-- 星星（夜晚模式顯示） -->
      <div class="stars">
        <span class="star" style="left:10%;top:20%"></span>
        <span class="star" style="left:20%;top:35%"></span>
        <span class="star" style="left:35%;top:15%"></span>
        <span class="star" style="left:50%;top:30%"></span>
        <span class="star" style="left:70%;top:18%"></span>
        <span class="star" style="left:85%;top:35%"></span>
      </div>

      <!-- 雲朵 -->
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>

      <!-- 開始畫面 -->
      <div id="startScreen">
        <div class="start-content">
          <h2>🦖 DINO RUN</h2>
          <p>準備好開始挑戰了嗎？</p>
          <div class="start-diff-hint">難度：<span id="startDiffBadge">🟡 普通</span></div>
          <div class="start-key">按 SPACE 或 ↑ 開始</div>
        </div>
      </div>

      <!-- 恐龍主角 -->
      <div id="dino">
        <div class="eye"></div>
        <div class="leg leg1"></div>
        <div class="leg leg2"></div>
      </div>

      <!-- 地面線 -->
      <div class="ground"></div>

      <!-- GAME OVER 結算畫面 -->
      <div id="gameOver">
        <h2>GAME OVER</h2>
        <p>難度：<span id="overDiffBadge">🟡 普通</span></p>
        <p>分數：<span id="finalScore">00000</span></p>
        <button id="restartBtn">↻ 重新開始</button>
        <p>按 SPACE 也可以重新開始</p>
      </div>
    </main>

    <!-- =========================
         控制列與模式切換
    ========================== -->
    <footer class="controls">
      <div>
        <span class="key">↑</span>
        <span class="key">SPACE</span>
        跳躍
      </div>

      <div>
        <span class="key">↓</span>
        蹲下
      </div>

      <div>
        速度：<span id="speedText">1.0x</span>
      </div>

      <button id="modeBtn" class="mode-btn">☀ / 🌙 夜晚模式</button>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
